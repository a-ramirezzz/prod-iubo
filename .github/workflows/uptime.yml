name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app availability
        id: check_app
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://prod-iubo.vercel.app)
          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::App returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "App is up (HTTP $HTTP_STATUS)"

      - name: Check Supabase connectivity
        id: check_supabase
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://axxbcsqgqszvgozgaczt.supabase.co/rest/v1/ -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 500 ]; then
            echo "::warning::Supabase returned HTTP $HTTP_STATUS"
          else
            echo "Supabase is reachable (HTTP $HTTP_STATUS)"
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 Uptime Alert: App down (${new Date().toISOString()})`;
            const body = `## Uptime Check Failed\n\n` +
              `- **Time:** ${new Date().toISOString()}\n` +
              `- **App Status:** ${process.env.APP_STATUS || 'unknown'}\n` +
              `- **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please investigate the deployment at https://prod-iubo.vercel.app`;

            // Check if there's already an open uptime issue to avoid spam
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert',
              per_page: 1
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['uptime-alert']
              });
            } else {
              // Add comment to existing issue instead of creating a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `🔴 Still down at ${new Date().toISOString()}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            }
        env:
          APP_STATUS: ${{ steps.check_app.outputs.status }}
